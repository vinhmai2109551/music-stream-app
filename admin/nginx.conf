# Served as a template: the nginx image replaces ${API_ORIGIN} with the environment variable of the
# same name when the container starts (see the Dockerfile and docker-compose.yml).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # What the page may load and talk to. A script injected into the page cannot run (script-src has
  # no 'unsafe-inline'), cannot send the tokens in localStorage to another site (connect-src names
  # the API and the storage of the uploads), and the page cannot be put in a frame. The one inline
  # script of index.html (it sets the light / dark mode before the first paint) is allowed by its
  # hash; src/csp.test.ts fails when the script changes and the hash below does not.
  # Ant Design writes its styles into <style> tags, so style-src keeps 'unsafe-inline'.
  set $csp "default-src 'self'; script-src 'self' 'sha256-3UzSLOxr5X/BJq4isb0CIexmNhM5rDq8DqXcdRUs/H8=' https://www.youtube.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' ${API_ORIGIN} https://*.r2.cloudflarestorage.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Files in /assets have a hash in their name: they never change, so they can be kept for good.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Single page app: any other path is a route of the app. index.html itself must not be cached,
  # or a new deploy would keep loading the old bundle.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }
}
